name: Build Signed Android Release

on:
  push:
    branches: [main, feature/open-source-document-engine, feature/wps-style-variable-width-pdf-edit, fix/direct-page-inline-pdf-text-edit, feature/pdfcraft-native-text-engine, fix/keep-inline-pdf-editor-focused, fix/prevent-native-edit-on-ocr-only-text, feat/ocr-scanned-text-replacement, feat/adaptive-scanned-pdf-text-replacement, fix/tap-to-inline-edit-pdf-text, feat/multiword-inline-pdf-text-selection]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-signed-release.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      publish_apk:
        description: "Publish the final root APK (use only after full testing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: habib-advance-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PdfCraft Rust toolchain and Android NDK
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android --target armv7-linux-androideabi --target x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/habib-advance-release.jks"
          test -s "$RUNNER_TEMP/habib-advance-release.jks"

      - name: Download offline Bengali and English OCR models
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --output app/src/main/assets/tessdata/ben.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/ben.traineddata
          curl --fail --location --retry 3 --output app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/ben.traineddata)" -eq 855841
          test "$(stat -c%s app/src/main/assets/tessdata/eng.traineddata)" -eq 4113088

      - name: Run complete unit test suite (final release only)
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/wps-style-variable-width-pdf-edit' || github.ref == 'refs/heads/fix/direct-page-inline-pdf-text-edit' || github.ref == 'refs/heads/feature/pdfcraft-native-text-engine' || github.ref == 'refs/heads/fix/keep-inline-pdf-editor-focused' || github.ref == 'refs/heads/fix/prevent-native-edit-on-ocr-only-text' || github.ref == 'refs/heads/feat/ocr-scanned-text-replacement' || github.ref == 'refs/heads/feat/adaptive-scanned-pdf-text-replacement' || github.ref == 'refs/heads/fix/tap-to-inline-edit-pdf-text' || github.ref == 'refs/heads/feat/multiword-inline-pdf-text-selection' || inputs.publish_apk == true }}
        run: gradle --no-configuration-cache --stacktrace --info testDebugUnitTest

      - name: Build signed release APK for targeted feature validation
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/habib-advance-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-configuration-cache assembleRelease

      - name: Verify APK package and signature
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/wps-style-variable-width-pdf-edit' || github.ref == 'refs/heads/fix/direct-page-inline-pdf-text-edit' || github.ref == 'refs/heads/feature/pdfcraft-native-text-engine' || github.ref == 'refs/heads/fix/keep-inline-pdf-editor-focused' || github.ref == 'refs/heads/fix/prevent-native-edit-on-ocr-only-text' || github.ref == 'refs/heads/feat/ocr-scanned-text-replacement' || github.ref == 'refs/heads/feat/adaptive-scanned-pdf-text-replacement' || github.ref == 'refs/heads/fix/tap-to-inline-edit-pdf-text' || github.ref == 'refs/heads/feat/multiword-inline-pdf-text-selection' || inputs.publish_apk == true }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          "$APKANALYZER" manifest application-id "$APK" | grep -Fx "com.habib.advanceeditor"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Create standard debug keystore for emulator tests
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Prepare Android instrumentation APKs before emulator startup
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/open-source-document-engine' || github.ref == 'refs/heads/feature/wps-style-variable-width-pdf-edit' || github.ref == 'refs/heads/fix/direct-page-inline-pdf-text-edit' || github.ref == 'refs/heads/feature/pdfcraft-native-text-engine' || github.ref == 'refs/heads/fix/keep-inline-pdf-editor-focused' || github.ref == 'refs/heads/fix/prevent-native-edit-on-ocr-only-text' || github.ref == 'refs/heads/feat/ocr-scanned-text-replacement' || github.ref == 'refs/heads/feat/adaptive-scanned-pdf-text-replacement' || github.ref == 'refs/heads/fix/tap-to-inline-edit-pdf-text' || github.ref == 'refs/heads/feat/multiword-inline-pdf-text-selection' || inputs.publish_apk == true }}
        run: |
          # Compile and package both APKs before the emulator consumes runner resources.
          gradle --no-configuration-cache assembleDebug assembleDebugAndroidTest

      - name: Run PDF validation and complete Android instrumentation suite
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/open-source-document-engine' || github.ref == 'refs/heads/feature/wps-style-variable-width-pdf-edit' || github.ref == 'refs/heads/fix/direct-page-inline-pdf-text-edit' || github.ref == 'refs/heads/feature/pdfcraft-native-text-engine' || github.ref == 'refs/heads/fix/keep-inline-pdf-editor-focused' || github.ref == 'refs/heads/fix/prevent-native-edit-on-ocr-only-text' || github.ref == 'refs/heads/feat/ocr-scanned-text-replacement' || github.ref == 'refs/heads/feat/adaptive-scanned-pdf-text-replacement' || github.ref == 'refs/heads/fix/tap-to-inline-edit-pdf-text' || github.ref == 'refs/heads/feat/multiword-inline-pdf-text-selection' || inputs.publish_apk == true }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          # APKs are prebuilt before emulator startup, so allocate dedicated guest resources.
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The emulator action executes script lines separately; delegate to one standalone Bash process.
          script: bash .github/scripts/run-android-instrumentation.sh

      - name: Publish APK as a GitHub Release asset
        if: ${{ github.ref == 'refs/heads/main' || inputs.publish_apk == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_TAG="habib-advance-build-${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" "$APK#Habib_Advance_Editor_Complete.apk" \
            --title "Habib Advance Editor build ${GITHUB_RUN_NUMBER}" \
            --notes "Verified signed Android APK. Package: com.habib.advanceeditor. Built from commit ${GITHUB_SHA} after unit and Android instrumentation tests passed."

          # GitHub rejects ordinary Git files larger than 100 MB. Retire the previous
          # root APK only after the replacement has been uploaded successfully as a release asset.
          if git ls-files --error-unmatch Habib_Advance_Editor_Complete.apk >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm Habib_Advance_Editor_Complete.apk
            git commit -m "Retire oversized root APK; publish release asset instead"
            git push
          fi

      - name: Upload APK artifact
        if: ${{ always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/wps-style-variable-width-pdf-edit' || github.ref == 'refs/heads/fix/direct-page-inline-pdf-text-edit' || github.ref == 'refs/heads/feature/pdfcraft-native-text-engine' || github.ref == 'refs/heads/fix/keep-inline-pdf-editor-focused' || github.ref == 'refs/heads/fix/prevent-native-edit-on-ocr-only-text' || github.ref == 'refs/heads/feat/ocr-scanned-text-replacement' || github.ref == 'refs/heads/feat/adaptive-scanned-pdf-text-replacement' || github.ref == 'refs/heads/fix/tap-to-inline-edit-pdf-text' || github.ref == 'refs/heads/feat/multiword-inline-pdf-text-selection' || inputs.publish_apk == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: Habib_Advance_Editor_Complete
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
