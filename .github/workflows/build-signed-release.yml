name: Build Signed Android Release

on:
  push:
    branches: [main, feature/open-source-document-engine]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-signed-release.yml'
  workflow_dispatch:
    inputs:
      publish_apk:
        description: "Publish the final root APK (use only after full testing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: habib-advance-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/habib-advance-release.jks"
          test -s "$RUNNER_TEMP/habib-advance-release.jks"

      - name: Download offline Bengali and English OCR models
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --output app/src/main/assets/tessdata/ben.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/ben.traineddata
          curl --fail --location --retry 3 --output app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/ben.traineddata)" -eq 855841
          test "$(stat -c%s app/src/main/assets/tessdata/eng.traineddata)" -eq 4113088

      - name: Run unit tests and build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/habib-advance-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --no-configuration-cache testDebugUnitTest assembleRelease

      - name: Verify APK package and signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          "$APKANALYZER" manifest application-id "$APK" | grep -Fx "com.habib.advanceeditor"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Create standard debug keystore for emulator tests
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Run Android OCR and secure-redaction instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --no-configuration-cache connectedDebugAndroidTest

      - name: Publish the single root APK
        if: ${{ github.ref == 'refs/heads/main' || inputs.publish_apk == true }}
        run: |
          find . -maxdepth 1 -type f -name '*.apk' ! -name 'Habib_Advance_Editor_Complete.apk' -delete
          cp app/build/outputs/apk/release/app-release.apk Habib_Advance_Editor_Complete.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Habib_Advance_Editor_Complete.apk
          git commit -m "Publish verified signed Habib Advance Editor APK" || echo "No APK changes to commit"
          git push

      - name: Upload APK artifact
        if: ${{ github.ref == 'refs/heads/main' || inputs.publish_apk == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Habib_Advance_Editor_Complete
          path: Habib_Advance_Editor_Complete.apk
          if-no-files-found: error
          retention-days: 30
