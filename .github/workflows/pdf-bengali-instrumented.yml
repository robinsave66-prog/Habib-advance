name: PDF Bengali Font Instrumented Test

on:
  push:
    branches: [feature/open-source-document-engine]
    paths:
      - '.github/workflows/pdf-bengali-instrumented.yml'

permissions:
  contents: read

concurrency:
  group: habib-pdf-bengali-instrumented
  cancel-in-progress: true

jobs:
  bengali-font:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download offline Bengali and English OCR models
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --output app/src/main/assets/tessdata/ben.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/ben.traineddata
          curl --fail --location --retry 3 --output app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/ben.traineddata)" -eq 855841
          test "$(stat -c%s app/src/main/assets/tessdata/eng.traineddata)" -eq 4113088

      - name: Create standard debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Run only the Bengali font instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-configuration-cache connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.engine.pdfbox.PdfBengaliFontInstrumentedTest
