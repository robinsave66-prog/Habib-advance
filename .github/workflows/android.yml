
name: Build HABIB WEALTH APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "fix/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q HABIB_WEALTH_Accounts_Transactions_v2.zip -d extracted

      - name: Patch Kotlin 2 Compose configuration
        run: python3 tools/patch_compose_gradle.py extracted/HABIB_WEALTH

      - name: Build APK
        run: gradle -p extracted/HABIB_WEALTH :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp extracted/HABIB_WEALTH/app/build/outputs/apk/debug/app-debug.apk release/Habib_Wealth.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habib_Wealth
          path: release/Habib_Wealth.apk
          if-no-files-found: error
