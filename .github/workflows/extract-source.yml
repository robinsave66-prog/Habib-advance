name: Extract Android Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir -p extracted_source
          unzip -o Habib_Advance_Editor_Source_Clean.zip -d extracted_source
          cp -a extracted_source/. .
          rm -rf extracted_source
          rm -f Habib_Advance_Editor_Source_Clean.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Habib Advance Editor source code" || echo "No changes to commit"
          git push
